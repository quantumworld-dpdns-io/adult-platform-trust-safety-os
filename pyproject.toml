[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adult-platform-trust-safety-os"
dynamic = ["version"]
description = "Adult platform trust and safety OS – moderation backend combining age verification, consent checks, and tamper-evident audit logs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "quantumworld-dpdns-io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "qdrant-client>=1.12.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
    "cryptography>=44.0.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "typer>=0.14.0",
    "orjson>=3.10.0",
    "msgpack>=1.1.0",
    "blake3>=1.0.0",
    "duckdb>=1.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.3.0",
    "qiskit-aer>=0.15.0",
]
ai = [
    "ollama>=0.4.0",
    "sentence-transformers>=3.3.0",
    "pillow>=11.0.0",
]
federated = [
    "flwr>=1.14.0",
]
full = [
    "adult-platform-trust-safety-os[quantum,ai,federated]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "factory-boy>=3.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "robotframework>=7.1.0",
    "robotframework-requests>=0.9.0",
    "robotframework-sshlibrary>=3.8.0",
    "locust>=2.32.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[project.scripts]
trust-safety = "src.cli.main:app"

[project.urls]
Homepage = "https://github.com/quantumworld-dpdns-io/adult-platform-trust-safety-os"
Repository = "https://github.com/quantumworld-dpdns-io/adult-platform-trust-safety-os"
Issues = "https://github.com/quantumworld-dpdns-io/adult-platform-trust-safety-os/issues"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PERF", "FURB", "LOG", "RUF"]
ignore = ["S101", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG"]
"**/migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "ollama.*",
    "flwr.*",
    "sentence_transformers.*",
    "duckdb.*",
    "robot.*",
    "minio.*",
    "msgpack.*",
    "blake3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "security: Security tests",
    "quantum: Quantum computing tests",
    "performance: Performance tests",
    "slow: Slow tests",
    "robot: Robot Framework tests",
]
addopts = "-v --tb=short --strict-markers -x"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "src/cli/*",
    "src/config/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.detect-secrets]
baseline = ".secrets.baseline"
