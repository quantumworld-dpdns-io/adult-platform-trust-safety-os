apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adult-platform-trust-safety.fullname" . }}
  labels:
    {{- include "adult-platform-trust-safety.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  WORKERS: {{ .Values.config.workers | quote }}
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
