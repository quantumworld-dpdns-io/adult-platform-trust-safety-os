[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trust-safety-sdk"
version = "1.0.0-alpha.1"
description = "Python SDK for the Adult Platform Trust & Safety OS API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "quantumworld-dpdns-io"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.3.0",
    "qiskit-aer>=0.15.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.version]
path = "src/trust_safety_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trust_safety_sdk"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
