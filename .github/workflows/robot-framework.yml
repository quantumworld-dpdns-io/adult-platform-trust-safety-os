name: Robot Framework Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1-5"

concurrency:
  group: robot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robot-framework:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trust_safety
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: trust_safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trust_safety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install robotframework robotframework-requests robotframework-sshlibrary

      - name: Run OWASP tests
        env:
          DATABASE_URL: postgresql+asyncpg://trust_safety:test_password@localhost:5432/trust_safety_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          robot \
            --outputdir reports/owasp \
            --output owasp_output.xml \
            --log owasp_log.html \
            --report owasp_report.html \
            --listener RetryFailed \
            --variable HEADERS:Content-Type:application/json \
            tests/robot/owasp/

      - name: Run functional tests
        env:
          DATABASE_URL: postgresql+asyncpg://trust_safety:test_password@localhost:5432/trust_safety_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          robot \
            --outputdir reports/functional \
            --output functional_output.xml \
            --log functional_log.html \
            --report functional_report.html \
            --variable HEADERS:Content-Type:application/json \
            tests/robot/functional/

      - name: Run API security tests
        env:
          DATABASE_URL: postgresql+asyncpg://trust_safety:test_password@localhost:5432/trust_safety_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          robot \
            --outputdir reports/security \
            --output security_output.xml \
            --log security_log.html \
            --report security_report.html \
            --variable HEADERS:Content-Type:application/json \
            tests/robot/security/

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-reports
          path: reports/
          retention-days: 30

      - name: Upload XML outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-xml
          path: |
            reports/**/*_output.xml

  notify-failure:
    runs-on: ubuntu-latest
    needs: robot-framework
    if: failure()
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Robot Framework tests failed on ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Robot Framework Tests Failed*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
