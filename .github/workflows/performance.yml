name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trust_safety
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: trust_safety_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trust_safety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start API server
        env:
          DATABASE_URL: postgresql+asyncpg://trust_safety:test_password@localhost:5432/trust_safety_perf
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: perf
        run: |
          uvicorn src.api.app:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -sf http://localhost:8000/health || exit 1

      - name: Run Locust benchmarks
        run: |
          locust \
            -f benchmarks/locustfile.py \
            --headless \
            --host http://localhost:8000 \
            -u 50 \
            -r 10 \
            --run-time 2m \
            --csv=reports/perf \
            --html=reports/perf_report.html \
            --only-summary \
            || true

      - name: Parse performance results
        run: |
          python3 -c "
          import csv, json, sys, os

          stats_file = 'reports/perf_stats.csv'
          if not os.path.exists(stats_file):
              print('No stats file found, skipping analysis')
              sys.exit(0)

          with open(stats_file) as f:
              reader = csv.DictReader(f)
              results = list(reader)

          summary = {}
          for row in results:
              name = row.get('Name', 'unknown')
              if name == 'Aggregated':
                  summary = {
                      'total_requests': row.get('Request Count', 0),
                      'avg_response_time': row.get('Average Response Time', 0),
                      'p95_response_time': row.get('95th percentile', 0),
                      'p99_response_time': row.get('99th percentile', 0),
                      'failure_rate': row.get('Failure Count', 0),
                      'rps': row.get('Requests/s', 0),
                  }

          with open('reports/perf_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          print(json.dumps(summary, indent=2))
          "

      - name: Compare with baseline
        run: |
          python3 -c "
          import json, os, sys

          if not os.path.exists('reports/perf_summary.json'):
              print('No current results to compare')
              sys.exit(0)

          with open('reports/perf_summary.json') as f:
              current = json.load(f)

          baseline_file = 'benchmarks/baseline.json'
          if not os.path.exists(baseline_file):
              print('No baseline found, saving current as baseline')
              with open(baseline_file, 'w') as f:
                  json.dump(current, f, indent=2)
              sys.exit(0)

          with open(baseline_file) as f:
              baseline = json.load(f)

          regressions = []
          threshold = 1.2  # 20% regression threshold

          for metric in ['avg_response_time', 'p95_response_time', 'p99_response_time']:
              base_val = float(baseline.get(metric, 0))
              curr_val = float(current.get(metric, 0))
              if base_val > 0 and curr_val > base_val * threshold:
                  regressions.append(f'{metric}: {curr_val}ms vs baseline {base_val}ms')

          if regressions:
              print('PERFORMANCE REGRESSION DETECTED:')
              for r in regressions:
                  print(f'  - {r}')
              sys.exit(1)
          else:
              print('Performance within acceptable range')
          "

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports/
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Performance Test Results\n\n';

            if (fs.existsSync('reports/perf_summary.json')) {
              const summary = JSON.parse(fs.readFileSync('reports/perf_summary.json', 'utf8'));
              body += '| Metric | Value |\n|--------|-------|\n';
              body += `| Total Requests | ${summary.total_requests} |\n`;
              body += `| Avg Response Time | ${summary.avg_response_time}ms |\n`;
              body += `| P95 Response Time | ${summary.p95_response_time}ms |\n`;
              body += `| P99 Response Time | ${summary.p99_response_time}ms |\n`;
              body += `| Requests/sec | ${summary.rps} |\n`;
            } else {
              body += 'No performance data collected.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
