version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - quantumworld-dpdns-io
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - pytest*
          - ruff
          - mypy
          - bandit
          - detect-secrets
          - pip-audit
          - robotframework*
          - locust
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - quantumworld-dpdns-io
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "docker"
