apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adult-platform-trust-safety.fullname" . }}
  labels:
    {{- include "adult-platform-trust-safety.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- else }}
  database-url: ""
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  redis-url: {{ .Values.secrets.redisUrl | b64enc | quote }}
  {{- else }}
  redis-url: ""
  {{- end }}
  {{- if .Values.secrets.minioEndpoint }}
  minio-endpoint: {{ .Values.secrets.minioEndpoint | b64enc | quote }}
  {{- else }}
  minio-endpoint: ""
  {{- end }}
