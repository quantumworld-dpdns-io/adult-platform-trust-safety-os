name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: staging

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace
        run: kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tag
        run: |
          export IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          envsubst < deploy/k8s/api-deployment.yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -
          kubectl set image deployment/api-server \
            api-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -n ${{ env.K8S_NAMESPACE }} -f deploy/k8s/namespace.yaml
          kubectl apply -n ${{ env.K8S_NAMESPACE }} -f deploy/k8s/api-service.yaml
          kubectl apply -n ${{ env.K8S_NAMESPACE }} -f deploy/k8s/ingress.yaml
          kubectl apply -n ${{ env.K8S_NAMESPACE }} -f deploy/k8s/hpa.yaml
          kubectl apply -n ${{ env.K8S_NAMESPACE }} -f deploy/k8s/network-policy.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-server \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

  smoke-tests:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Run smoke tests
        run: |
          API_POD=$(kubectl get pod -n ${{ env.K8S_NAMESPACE }} -l app=api-server -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.K8S_NAMESPACE }} "$API_POD" -- python -c "
          import httpx
          import sys
          try:
              r = httpx.get('http://localhost:8000/health', timeout=10)
              r.raise_for_status()
              print(f'Health check passed: {r.status_code}')
          except Exception as e:
              print(f'Health check failed: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Check pod health
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=api-server
          READY=$(kubectl get deployment api-server -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl get deployment api-server -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.replicas}')
          echo "Ready: ${READY:-0}/${DESIRED}"
          if [ "${READY:-0}" -lt "$DESIRED" ]; then
            echo "::error::Not all pods are ready"
            kubectl describe deployment api-server -n ${{ env.K8S_NAMESPACE }}
            exit 1
          fi
